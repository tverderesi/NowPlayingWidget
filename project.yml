name: NowPlayingWidget
options:
  bundleIdPrefix: dev.tverderesi
  deploymentTarget:
    macOS: "15.4"
packages:
  MediaRemoteAdapter:
    url: https://github.com/ejbills/mediaremote-adapter.git
    branch: master
settings:
  base:
    SWIFT_VERSION: 5.0
    CODE_SIGN_STYLE: Automatic
    MACOSX_DEPLOYMENT_TARGET: 15.4
    MARKETING_VERSION: "1.0.7"
    CURRENT_PROJECT_VERSION: "7"

targets:
  NowPlayingWidget:
    type: application
    platform: macOS
    sources:
      - NowPlayingWidget
      - Shared
    dependencies:
      - package: MediaRemoteAdapter
        embed: true
      - target: NowPlayingWidgetWidgetExtension
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tverderesi.NowPlayingWidget
        PRODUCT_NAME: NowPlayingWidget
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSUIElement: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Now Playing Widget
    entitlements:
      path: NowPlayingWidget/NowPlayingWidget.entitlements
      properties:
        com.apple.security.app-sandbox: false

  NowPlayingWidgetWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - NowPlayingWidgetWidget
      - Shared
    info:
      path: NowPlayingWidgetWidget/Info.plist
      properties:
        CFBundleDisplayName: Now Playing
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tverderesi.NowPlayingWidget.widget.v2
        PRODUCT_NAME: NowPlayingWidgetWidget
        SKIP_INSTALL: YES
    entitlements:
      path: NowPlayingWidgetWidget/NowPlayingWidgetWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
